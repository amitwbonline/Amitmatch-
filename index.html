<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amit Match - Dating Site</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f9;
  color:#29252d;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#f72570,#a928bd);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.menu-btn{
  display:none;
  border:0;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:25px;
  padding:6px 12px;
  border-radius:8px;
}

nav{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

nav button{
  border:0;
  background:rgba(255,255,255,.15);
  color:white;
  padding:9px 13px;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

nav button:hover{
  background:white;
  color:#e91e63;
}

/* MOBILE MENU */
.mobile-menu{
  display:none;
  max-width:1100px;
  margin:10px auto 0;
}

.mobile-menu button{
  width:100%;
  margin:4px 0;
  padding:12px;
  border:0;
  border-radius:8px;
  background:white;
  color:#e91e63;
  text-align:left;
}

/* PAGE */
.page{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 50px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

/* HOME */
.hero{
  text-align:center;
  padding:55px 15px;
}

.hero h1{
  font-size:42px;
  color:#e91e63;
  margin:10px 0;
}

.hero p{
  font-size:18px;
  color:#666;
}

.primary{
  border:0;
  background:linear-gradient(135deg,#f72570,#a928bd);
  color:white;
  padding:13px 25px;
  border-radius:28px;
  font-size:17px;
  cursor:pointer;
}

.secondary{
  border:1px solid #e91e63;
  background:white;
  color:#e91e63;
  padding:12px 22px;
  border-radius:25px;
  cursor:pointer;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px auto;
  max-width:600px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#e91e63;
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:12px 14px;
  margin:7px 0 13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-weight:bold;
  font-size:14px;
}

.form-button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:25px;
  background:#e91e63;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* PROFILE */
.profile-card{
  background:white;
  max-width:600px;
  margin:15px auto;
  padding:20px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.profile-photo{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  display:block;
  margin:5px auto 15px;
}

.profile-name{
  font-size:25px;
  font-weight:bold;
}

.profile-info{
  color:#666;
  margin:7px 0;
}

/* SEARCH */
.filters{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.people{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.person-card{
  background:white;
  border-radius:18px;
  padding:16px;
  text-align:center;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.person-card img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.person-card h3{
  margin:10px 0 5px;
}

.person-card p{
  color:#666;
  margin:5px;
}

.like-btn{
  border:0;
  background:#e91e63;
  color:white;
  padding:10px 20px;
  border-radius:22px;
  cursor:pointer;
  margin-top:8px;
}

.like-btn.liked{
  background:#777;
}

.chat-btn{
  border:0;
  background:#7b2cbf;
  color:white;
  padding:10px 20px;
  border-radius:22px;
  cursor:pointer;
  margin-top:8px;
}

.unlike-btn{
  border:0;
  background:#ddd;
  color:#333;
  padding:10px 18px;
  border-radius:22px;
  cursor:pointer;
  margin-top:8px;
}

/* MATCH */
.match-card{
  background:white;
  padding:15px;
  border-radius:18px;
  margin:12px auto;
  max-width:600px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.match-card img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
}

.match-info{
  flex:1;
}

.match-info h3{
  margin:0 0 5px;
}

.match-info p{
  margin:0;
  color:#777;
}

.match-actions{
  display:flex;
  flex-direction:column;
  gap:7px;
}

/* MESSAGE */
.message{
  padding:12px;
  text-align:center;
  color:#777;
}

/* LOADING */
.loading{
  text-align:center;
  padding:35px;
  color:#777;
}

/* MOBILE */
@media(max-width:700px){

  .menu-btn{
    display:block;
  }

  header nav{
    display:none;
  }

  .mobile-menu.open{
    display:block;
  }

  .hero h1{
    font-size:32px;
  }

  .people{
    grid-template-columns:1fr;
  }

  .match-card{
    align-items:flex-start;
  }

  .match-actions{
    width:100px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      💖 Amit Match
    </div>

    <button class="menu-btn" onclick="toggleMenu()">
      ☰
    </button>

    <nav>

      <button onclick="showSection('home')">
        🏠 Home
      </button>

      <button onclick="showSection('search')">
        🔎 Search
      </button>

      <button onclick="showSection('profile')">
        👤 Profile
      </button>

      <button onclick="showSection('matches')">
        💕 Matches
      </button>

      <button id="logoutBtn">
        🚪 Logout
      </button>

    </nav>

  </div>


  <div class="mobile-menu" id="mobileMenu">

    <button onclick="showSection('home')">
      🏠 Home
    </button>

    <button onclick="showSection('search')">
      🔎 Search
    </button>

    <button onclick="showSection('profile')">
      👤 Profile
    </button>

    <button onclick="showSection('matches')">
      💕 Matches
    </button>

    <button id="mobileLogout">
      🚪 Logout
    </button>

  </div>

</header>


<div class="page">


<!-- HOME -->

<section id="home" class="section active">

  <div class="hero">

    <div style="font-size:60px">
      💖
    </div>

    <h1>Amit Match</h1>

    <p>
      নতুন মানুষের সাথে পরিচিত হন,
      কথা বলুন এবং নিজের Match খুঁজে নিন।
    </p>

    <br>

    <button
      class="primary"
      onclick="showSection('search')">
      🔎 Find Your Match
    </button>

  </div>

</section>


<!-- LOGIN -->

<section id="login" class="section">

  <div class="card">

    <h2>🔐 Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="আপনার Email">

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password">

    <button
      class="form-button"
      id="loginBtn">
      Login
    </button>

    <p style="text-align:center">
      Account নেই?
      <button
        class="secondary"
        onclick="showSection('register')">
        Register
      </button>
    </p>

    <div id="loginMessage"></div>

  </div>

</section>


<!-- REGISTER -->

<section id="register" class="section">

  <div class="card">

    <h2>❤️ Create Account</h2>

    <label>Email</label>

    <input
      type="email"
      id="registerEmail"
      placeholder="Email">

    <label>Password</label>

    <input
      type="password"
      id="registerPassword"
      placeholder="কমপক্ষে 6 characters">

    <button
      class="form-button"
      id="registerBtn">
      Create Account
    </button>

    <p style="text-align:center">
      Account আছে?
      <button
        class="secondary"
        onclick="showSection('login')">
        Login
      </button>
    </p>

    <div id="registerMessage"></div>

  </div>

</section>


<!-- PROFILE -->

<section id="profile" class="section">

  <div class="card">

    <h2>👤 My Profile</h2>

    <label>Name</label>

    <input
      type="text"
      id="profileName"
      placeholder="আপনার নাম">

    <label>Age</label>

    <input
      type="number"
      id="profileAge"
      placeholder="বয়স">

    <label>Gender</label>

    <select id="profileGender">

      <option value="">
        Select Gender
      </option>

      <option value="Male">
        Male
      </option>

      <option value="Female">
        Female
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <label>Looking For</label>

    <select id="lookingFor">

      <option value="">
        Select
      </option>

      <option value="Male">
        Male
      </option>

      <option value="Female">
        Female
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <label>City</label>

    <input
      type="text"
      id="profileCity"
      placeholder="আপনার শহর">


    <label>Photo URL</label>

    <input
      type="url"
      id="profilePhoto"
      placeholder="ছবির URL">


    <label>About You</label>

    <textarea
      id="profileBio"
      placeholder="নিজের সম্পর্কে কিছু লিখুন">
    </textarea>


    <button
      class="form-button"
      id="saveProfileBtn">
      💾 Save Profile
    </button>

    <div id="profileMessage"></div>

  </div>


  <div
    id="myProfilePreview"
    class="profile-card"
    style="display:none">

  </div>

</section>


<!-- SEARCH -->

<section id="search" class="section">

  <h2>🔎 Find People</h2>

  <div class="filters">

    <label>Gender</label>

    <select id="searchGender">

      <option value="">
        All
      </option>

      <option value="Male">
        Male
      </option>

      <option value="Female">
        Female
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <label>City</label>

    <input
      type="text"
      id="searchCity"
      placeholder="City">

  </div>


  <div id="people" class="people">

    <div class="loading">
      🔎 Loading profiles...
    </div>

  </div>

</section>


<!-- MATCHES -->

<section id="matches" class="section">

  <h2>💕 My Matches</h2>

  <div id="matchesList">

    <div class="loading">
      Loading matches...
    </div>

  </div>

</section>


</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  deleteDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyAHKG7uIA3oQK5Syfq96xJW-lKbjihswl4",

  authDomain:
  "amit-match.firebaseapp.com",

  projectId:
  "amit-match",

  storageBucket:
  "amit-match.firebasestorage.app",

  messagingSenderId:
  "128100464896",

  appId:
  "1:128100464896:web:471c7a89502d1a6a679be5",

  measurementId:
  "G-F1P824DE41"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   GLOBAL
========================= */

let currentUser = null;

let myProfile = null;

let unsubscribeLikes = null;

let unsubscribeMatches = null;


/* =========================
   SECTION
========================= */

window.showSection = function(name){

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove("active");

    });


  const target =
    document.getElementById(name);


  if(target){

    target.classList.add("active");

  }


  document
    .getElementById("mobileMenu")
    .classList.remove("open");


  if(name === "search"){

    loadProfiles();

  }


  if(name === "matches"){

    loadMatches();

  }


  if(name === "profile"){

    loadMyProfile();

  }

};


/* =========================
   MOBILE MENU
========================= */

window.toggleMenu = function(){

  document
    .getElementById("mobileMenu")
    .classList.toggle("open");

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(user){

      await loadMyProfile();


      document
        .getElementById("login")
        .classList.remove("active");


      document
        .getElementById("home")
        .classList.add("active");


      loadMatches();

    }else{

      myProfile = null;

      showSection("home");

    }

  }
);


/* =========================
   REGISTER
========================= */

document
  .getElementById("registerBtn")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
        .getElementById("registerEmail")
        .value.trim();

      const password =
        document
        .getElementById("registerPassword")
        .value;


      if(!email || !password){

        document
          .getElementById("registerMessage")
          .innerHTML =
          "⚠️ Email এবং Password দিন।";

        return;

      }


      try{

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await setDoc(
          doc(
            db,
            "profiles",
            result.user.uid
          ),
          {

            uid:
              result.user.uid,

            email:
              email,

            name:
              "",

            age:
              "",

            gender:
              "",

            lookingFor:
              "",

            city:
              "",

            photo:
              "",

            bio:
              "",

            createdAt:
              serverTimestamp()

          }
        );


        document
          .getElementById("registerMessage")
          .innerHTML =
          "✅ Account তৈরি হয়েছে। Profile পূরণ করুন।";


        showSection("profile");


      }catch(error){

        document
          .getElementById("registerMessage")
          .innerHTML =
          "❌ " + error.message;

      }

    }
  );


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
        .getElementById("loginEmail")
        .value.trim();

      const password =
        document
        .getElementById("loginPassword")
        .value;


      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        showSection("home");


      }catch(error){

        document
          .getElementById("loginMessage")
          .innerHTML =
          "❌ Email অথবা Password ভুল।";

      }

    }
  );


/* =========================
   LOGOUT
========================= */

async function logout(){

  await signOut(auth);

  alert("আপনি Logout করেছেন।");

  showSection("home");

}


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


document
  .getElementById("mobileLogout")
  .addEventListener(
    "click",
    logout
  );


/* =========================
   LOAD MY PROFILE
========================= */

async function loadMyProfile(){

  if(!currentUser){

    return;

  }


  const snap =
    await getDoc(
      doc(
        db,
        "profiles",
        currentUser.uid
      )
    );


  if(!snap.exists()){

    return;

  }


  myProfile = snap.data();


  document
    .getElementById("profileName")
    .value =
    myProfile.name || "";


  document
    .getElementById("profileAge")
    .value =
    myProfile.age || "";


  document
    .getElementById("profileGender")
    .value =
    myProfile.gender || "";


  document
    .getElementById("lookingFor")
    .value =
    myProfile.lookingFor || "";


  document
    .getElementById("profileCity")
    .value =
    myProfile.city || "";


  document
    .getElementById("profilePhoto")
    .value =
    myProfile.photo || "";


  document
    .getElementById("profileBio")
    .value =
    myProfile.bio || "";


  showMyProfilePreview();

}


/* =========================
   SAVE PROFILE
========================= */

document
  .getElementById("saveProfileBtn")
  .addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert("আগে Login করুন।");

        showSection("login");

        return;

      }


      const data = {

        uid:
          currentUser.uid,

        email:
          currentUser.email || "",

        name:
          document
          .getElementById("profileName")
          .value.trim(),

        age:
          document
          .getElementById("profileAge")
          .value,

        gender:
          document
          .getElementById("profileGender")
          .value,

        lookingFor:
          document
          .getElementById("lookingFor")
          .value,

        city:
          document
          .getElementById("profileCity")
          .value.trim(),

        photo:
          document
          .getElementById("profilePhoto")
          .value.trim(),

        bio:
          document
          .getElementById("profileBio")
          .value.trim(),

        updatedAt:
          serverTimestamp()

      };


      try{

        await setDoc(
          doc(
            db,
            "profiles",
            currentUser.uid
          ),
          data,
          {merge:true}
        );


        myProfile = data;


        document
          .getElementById("profileMessage")
          .innerHTML =
          "✅ Profile saved successfully!";


        showMyProfilePreview();


      }catch(error){

        document
          .getElementById("profileMessage")
          .innerHTML =
          "❌ Profile save হয়নি: " +
          error.message;

      }

    }
  );


/* =========================
   PROFILE PREVIEW
========================= */

function showMyProfilePreview(){

  if(!myProfile){

    return;

  }


  const box =
    document
    .getElementById("myProfilePreview");


  box.style.display = "block";


  const photo =
    safeImage(
      myProfile.photo
    );


  box.innerHTML = `

    <img
      class="profile-photo"
      src="${photo}"
      onerror="this.src='https://via.placeholder.com/130?text=Profile'"
    >

    <div class="profile-name">
      ${escapeHTML(myProfile.name || "Your Name")}
    </div>

    <div class="profile-info">
      ${myProfile.age ? escapeHTML(myProfile.age)+" years" : ""}
      ${myProfile.gender ? " • "+escapeHTML(myProfile.gender) : ""}
    </div>

    <div class="profile-info">
      📍 ${escapeHTML(myProfile.city || "City not added")}
    </div>

    <p>
      ${escapeHTML(myProfile.bio || "No bio yet.")}
    </p>

  `;

}


/* =========================
   LOAD PROFILES
========================= */

async function loadProfiles(){

  const people =
    document.getElementById("people");


  if(!currentUser){

    people.innerHTML = `

      <div class="card">

        <h2>🔐 Login Required</h2>

        <p>
          Profile দেখতে আগে Login করুন।
        </p>

        <button
          class="primary"
          onclick="showSection('login')">
          Login
        </button>

      </div>

    `;

    return;

  }


  people.innerHTML =
    `<div class="loading">
      🔎 Profiles loading...
    </div>`;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "profiles"
        )
      );


    const gender =
      document
      .getElementById("searchGender")
      .value;

    const city =
      document
      .getElementById("searchCity")
      .value
      .trim()
      .toLowerCase();


    const profiles = [];


    snap.forEach(docSnap => {

      const p =
        docSnap.data();


      if(p.uid === currentUser.uid){

        return;

      }


      if(
        gender &&
        p.gender !== gender
      ){

        return;

      }


      if(
        city &&
        !(p.city || "")
        .toLowerCase()
        .includes(city)
      ){

        return;

      }


      profiles.push(p);

    });


    if(profiles.length === 0){

      people.innerHTML = `

        <div class="message">

          😔 কোনো profile পাওয়া যায়নি।

        </div>

      `;

      return;

    }


    people.innerHTML = "";


    for(const p of profiles){

      const liked =
        await hasLiked(p.uid);


      const card =
        document.createElement("div");

      card.className =
        "person-card";


      card.innerHTML = `

        <img
          src="${safeImage(p.photo)}"
          onerror="this.src='https://via.placeholder.com/110?text=User'"
        >

        <h3>
          ${escapeHTML(p.name || "User")}
        </h3>

        <p>
          ${p.age ? escapeHTML(p.age)+" years" : ""}
          ${p.gender ? " • "+escapeHTML(p.gender) : ""}
        </p>

        <p>
          📍 ${escapeHTML(p.city || "")}
        </p>

        <p>
          ${escapeHTML(p.bio || "")}
        </p>

        <button
          class="like-btn ${liked ? "liked" : ""}"
          data-uid="${p.uid}"
          data-name="${escapeHTML(p.name || "User")}"
        >
          ${liked ? "❤️ Liked" : "❤️ Like"}
        </button>

      `;


      const likeButton =
        card.querySelector(".like-btn");


      likeButton.addEventListener(
        "click",
        () => {

          likeUser(
            p.uid,
            p.name || "User",
            likeButton
          );

        }
      );


      people.appendChild(card);

    }


  }catch(error){

    people.innerHTML =
      `<div class="message">
        ❌ Profiles load হয়নি।
        <br><br>
        ${escapeHTML(error.message)}
      </div>`;

  }

}

/* =========================
   CHECK LIKE
========================= */

async function hasLiked(uid){

  if(!currentUser){

    return false;

  }


  const id =
    currentUser.uid +
    "_" +
    uid;


  const snap =
    await getDoc(
      doc(
        db,
        "likes",
        id
      )
    );


  return snap.exists();

}


/* =========================
   LIKE USER
========================= */

async function likeUser(
  uid,
  name,
  button
){

  if(!currentUser){

    return;

  }


  const likeId =
    currentUser.uid +
    "_" +
    uid;


  try{

    const existing =
      await getDoc(
        doc(
          db,
          "likes",
          likeId
        )
      );


    if(existing.exists()){

      return;

    }


    await setDoc(
      doc(
        db,
        "likes",
        likeId
      ),
      {

        from:
          currentUser.uid,

        to:
          uid,

        createdAt:
          serverTimestamp()

      }
    );


    button.innerText =
      "❤️ Liked";

    button.classList.add(
      "liked"
    );


    /* Check mutual like */

    const reverseId =
      uid +
      "_" +
      currentUser.uid;


    const reverse =
      await getDoc(
        doc(
          db,
          "likes",
          reverseId
        )
      );


    if(reverse.exists()){

      const matchId =
        [currentUser.uid,uid]
        .sort()
        .join("_");


      await setDoc(
        doc(
          db,
          "matches",
          matchId
        ),
        {

          users:
            [
              currentUser.uid,
              uid
            ],

          createdAt:
            serverTimestamp()

        }
      );


      alert(
        "💕 It's a Match!"
      );

    }else{

      alert(
        "❤️ Like sent!"
      );

    }


  }catch(error){

    alert(
      "Like করা যায়নি: " +
      error.message
    );

  }

}


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches(){

  const box =
    document
    .getElementById("matchesList");


  if(!currentUser){

    box.innerHTML = `
      <div class="message">
        🔐 আগে Login করুন।
      </div>
    `;

    return;

  }


  box.innerHTML =
    `<div class="loading">
      💕 Matches loading...
    </div>`;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "matches"
        )
      );


    const matches = [];


    snap.forEach(docSnap => {

      const data =
        docSnap.data();


      if(
        Array.isArray(data.users) &&
        data.users.includes(
          currentUser.uid
        )
      ){

        matches.push(data);

      }

    });


    if(matches.length === 0){

      box.innerHTML = `

        <div class="message">

          💕 এখনো কোনো Match নেই।<br><br>

          Search থেকে কাউকে Like করুন।

        </div>

      `;

      return;

    }


    box.innerHTML = "";


    for(const match of matches){

      const otherUid =
        match.users.find(
          uid =>
            uid !== currentUser.uid
        );


      if(!otherUid){

        continue;

      }


      const profileSnap =
        await getDoc(
          doc(
            db,
            "profiles",
            otherUid
          )
        );


      if(!profileSnap.exists()){

        continue;

      }


      const p =
        profileSnap.data();


      const card =
        document.createElement("div");

      card.className =
        "match-card";


      card.innerHTML = `

        <img
          src="${safeImage(p.photo)}"
          onerror="this.src='https://via.placeholder.com/70?text=User'"
        >

        <div class="match-info">

          <h3>
            ${escapeHTML(p.name || "User")}
          </h3>

          <p>
            ${p.age ? escapeHTML(p.age)+" years" : ""}
            ${p.city ? " • "+escapeHTML(p.city) : ""}
          </p>

        </div>

        <div class="match-actions">

          <button
            class="chat-btn">
            💬 Chat
          </button>

        </div>

      `;


      card
        .querySelector(".chat-btn")
        .addEventListener(
          "click",
          () => {

            openChat(
              otherUid,
              p.name || "User"
            );

          }
        );


      box.appendChild(card);

    }


  }catch(error){

    box.innerHTML =
      `<div class="message">
        ❌ Matches load হয়নি।
        <br><br>
        ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================
   OPEN CHAT
========================= */

function openChat(
  uid,
  name
){

  window.location.href =
    "Chat.html?uid=" +
    encodeURIComponent(uid) +
    "&name=" +
    encodeURIComponent(name);

}


/* =========================
   HELPERS
========================= */

function safeImage(url){

  if(
    url &&
    (
      url.startsWith("http://") ||
      url.startsWith("https://")
    )
  ){

    return url;

  }


  return "https://via.placeholder.com/130?text=Amit+Match";

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function debounce(
  func,
  delay
){

  let timer;

  return function(){

    clearTimeout(timer);

    timer =
      setTimeout(
        func,
        delay
      );

  };

}
